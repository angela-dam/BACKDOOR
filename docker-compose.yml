version: '3.8'

services:
  backdoor-db:
    image: postgres:16-alpine
    container_name: backdoor_postgres
    restart: always
    environment:
      POSTGRES_DB: backdoor
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_backdoor_data:/var/lib/postgresql/data
      - ./docker/init/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql

volumes:
  postgres_backdoor_data: